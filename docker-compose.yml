# HambotV2: bot + PostgreSQL. Copy .env.example to .env and fill in the values, then run:
#   docker compose up -d --build
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hambot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hambotdb}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Uncomment to inspect the database from the host:
    # ports:
    #   - "5432:5432"

  bot:
    build:
      context: .
      dockerfile: HambotV2/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      Secrets__BotToken: ${DISCORD_BOT_TOKEN:?Set DISCORD_BOT_TOKEN in .env}
      ConnectionStrings__DefaultConnection: "Server=db;Port=5432;Database=${POSTGRES_DB:-hambotdb};User Id=${POSTGRES_USER:-hambot};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"

volumes:
  db-data:
