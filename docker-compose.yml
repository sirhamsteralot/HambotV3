# HambotV2: bot + PostgreSQL + backup sidecar. Copy .env.example to .env and fill in the values, then run:
#   docker compose up -d --build
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hambot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hambotdb}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Uncomment to inspect the database from the host:
    # ports:
    #   - "5432:5432"

  bot:
    build:
      context: .
      dockerfile: HambotV2/Dockerfile
      # The version pieces the bot embeds (design §3.9); deploy.sh exports both from the
      # server clone. A plain `docker compose up --build` without them leaves the bot on
      # the 0.0.0+unknown fallback (FR-76).
      args:
        BOT_VERSION_TAG: ${BOT_VERSION_TAG:-}
        BOT_VERSION_COMMIT: ${BOT_VERSION_COMMIT:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      Secrets__BotToken: ${DISCORD_BOT_TOKEN:?Set DISCORD_BOT_TOKEN in .env}
      ConnectionStrings__DefaultConnection: "Server=db;Port=5432;Database=${POSTGRES_DB:-hambotdb};User Id=${POSTGRES_USER:-hambot};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      # Optional: the bot owner — the globally highest permission tier, above every guild (Permissions:BotOwnerDiscordId).
      Permissions__BotOwnerDiscordId: ${BOT_OWNER_DISCORD_ID:-}
      # The shared backup volume (design §5.2): the !backup/!backups/!restorebackup commands
      # and the !health backup fields operate on the sidecar's dumps.
      Backups__Directory: /app/backups
      # Optional: the default operator notification channel (runtime-overridable via !notifychannel, FR-117).
      Notifications__ChannelId: ${NOTIFY_CHANNEL_ID:-}
      # Optional watchdog tuning (defaults: 5-minute checks, 10-minute gateway-down threshold, hourly re-alerts).
      Watchdog__CheckIntervalMinutes: ${WATCHDOG_CHECK_INTERVAL_MINUTES:-}
      Watchdog__GatewayDownAlertMinutes: ${WATCHDOG_GATEWAY_DOWN_ALERT_MINUTES:-}
      Watchdog__ReAlertMinutes: ${WATCHDOG_RE_ALERT_MINUTES:-}
      # Optional: expose the administrative/configuration and user-scoped commands as
      # Discord slash commands (FR-110, default false).
      SlashCommands__Enabled: ${SLASH_COMMANDS_ENABLED:-}
      # Optional: the operator-agent MCP endpoint (FR-86, default off) — status, guild,
      # messaging, and command tools for an agent on the deployment host. The API key is
      # required when enabled; without it the endpoint stays down (FR-87).
      Mcp__Enabled: ${MCP_ENABLED:-}
      Mcp__ApiKey: ${MCP_API_KEY:-}
      Mcp__ListenUri: ${MCP_LISTEN_URI:-}
      # Optional: LLM features (design §3.12). Llm__ApiKey is the secret; without it every
      # LLM feature stays inactive. Defaults live in appsettings.json.
      Llm__ApiKey: ${LLM_API_KEY:-}
      Llm__Persona: ${LLM_PERSONA:-}
      Llm__PresenceUpdates__Enabled: ${LLM_PRESENCE_UPDATES_ENABLED:-}
      Llm__PresenceUpdates__IntervalMinutes: ${LLM_PRESENCE_INTERVAL_MINUTES:-}
      Llm__ChatContext__MaxMessages: ${LLM_CHAT_CONTEXT_MAX_MESSAGES:-}
      Llm__ChatContext__MaxCharacters: ${LLM_CHAT_CONTEXT_MAX_CHARACTERS:-}
      Llm__BioUpdates__Enabled: ${LLM_BIO_UPDATES_ENABLED:-}
      Llm__BioUpdates__IntervalMinutes: ${LLM_BIO_INTERVAL_MINUTES:-}
      Llm__DailyRequestBudget: ${LLM_DAILY_REQUEST_BUDGET:-}
    volumes:
      - backups:/app/backups
    # The MCP endpoint's listen port, published loopback-only (FR-86): an agent on the
    # deployment host reaches http://127.0.0.1:2525/mcp while the internet cannot. Nothing
    # listens on it while the endpoint is disabled.
    ports:
      - "127.0.0.1:2525:2525"

  # Backup sidecar (FR-81–FR-85, FR-100–FR-101; design §5.2): backs the database up on
  # schedule independently of the bot, validates each dump, prunes local retention, pushes
  # offsite when configured, runs the periodic restore test, and writes the status file
  # the bot's !health command and watchdog consume.
  backup:
    build:
      context: ./scripts/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-hambot}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-hambotdb}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
      BACKUP_TEST_INTERVAL: ${BACKUP_TEST_INTERVAL:-2592000}
      # Offsite push (optional, FR-82): an rclone remote path. With BACKUP_RCLONE_REMOTE set,
      # the credentials below configure the rclone remote named "backup" via environment
      # (RCLONE_CONFIG_BACKUP_*); e.g. BACKUP_RCLONE_REMOTE=backup:my-bucket/hambotv2.
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      RCLONE_CONFIG_BACKUP_TYPE: ${BACKUP_S3_TYPE:-s3}
      RCLONE_CONFIG_BACKUP_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_BACKUP_REGION: ${BACKUP_S3_REGION:-}
      RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - backups:/backups

volumes:
  db-data:
  backups:
