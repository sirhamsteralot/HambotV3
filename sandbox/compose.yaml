# Dev sandbox: the image from ./Dockerfile with the repo bind-mounted at
# /work/repo. Run from this directory:
#
#   SANDBOX_UID=$(id -u) SANDBOX_GID=$(id -g) docker compose build
#   docker compose run --rm sandbox dotnet test HambotV2.sln
#   docker compose run --rm sandbox              # interactive shell
#
name: hambotv2-sandbox

services:
  sandbox:
    build:
      context: .                 # this directory, NOT the repo root
      args:
        USER_UID: ${SANDBOX_UID:-1000}
        USER_GID: ${SANDBOX_GID:-1000}
    image: hambotv2-sandbox:latest
    init: true
    # Default: the non-root dev account built with SANDBOX_UID/SANDBOX_GID.
    # On Windows Docker Desktop, host-created files appear as root inside the
    # mount, so a non-root container cannot set timestamps on stale build
    # outputs (MSBuild MSB3374). Run as root there — Windows ignores unix
    # ownership, so nothing is lost:
    #   SANDBOX_USER=0:0 docker compose run --rm sandbox dotnet test HambotV2.sln
    user: ${SANDBOX_USER:-dev}
    working_dir: /work/repo
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    volumes:
      - ..:/work/repo            # the repo itself; ".." = parent of this file
      - nuget-cache:/home/dev/.nuget/packages
    stdin_open: true
    tty: true

volumes:
  nuget-cache:
