# Default-deny egress with a hostname allowlist (one ERE per line in
# allowlist.txt). HTTPS only: no git-over-ssh, no raw TCP egress.
Port 8888
Listen 0.0.0.0
Timeout 600
# Only the agent container sits on the sandbox network (compose allocates from
# the default pools 172.17.0.0/12 and 192.168.0.0/16).
Allow 172.16.0.0/12
Allow 192.168.0.0/16
Filter "/etc/tinyproxy/allowlist.txt"
FilterDefaultDeny Yes
FilterExtended On
ConnectPort 443
ConnectPort 563
DisableViaHeader Yes
LogLevel Info
# tmpfs: the egress container is read-only.
LogFile "/tmp/tinyproxy.log"
PidFile "/tmp/tinyproxy.pid"
MaxClients 40
