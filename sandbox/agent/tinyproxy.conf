# Default-deny egress with a hostname allowlist (one ERE per line in
# allowlist.txt). CONNECT is restricted to port 443 (HTTPS only: no
# git-over-ssh, no raw TCP). Plain-HTTP requests to allowlisted hosts on
# other ports still pass the host filter — the allowlist, not the port,
# is the boundary.
Port 8888
# Bind only the egress address on the pinned sandbox subnet (compose.yaml:
# sandbox network 10.255.254.0/24, egress = 10.255.254.2), so containers on
# any other bridge network on the host cannot reach the proxy.
Listen 10.255.254.2
Timeout 600
Allow 127.0.0.1
Allow 10.255.254.0/24
Filter "/etc/tinyproxy/allowlist.txt"
FilterDefaultDeny Yes
FilterExtended On
ConnectPort 443
DisableViaHeader Yes
LogLevel Info
# tmpfs: the egress container is read-only.
LogFile "/tmp/tinyproxy.log"
PidFile "/tmp/tinyproxy.pid"
MaxClients 40
